<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raízes do Nordeste - Unidade</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <header class="cabecalho-principal">
        <img src="img/logo.png" alt="Raízes do Nordeste" class="logo-mini">
    </header>

    <main class="hero-section">
        <div class="card-central">
            <h2>Onde você está?</h2>
            <p>Selecione a unidade para carregar o cardápio local:</p>
            
            <select id="seletor-unidade" class="input-padrao">
                <option value="" disabled selected>Escolha uma loja...</option>
                <option value="recife">Recife-PE (Matriz)</option>
                <option value="belohorizonte">Belo Horizonte-MG</option>
                <option value="brasilia">Brasília-DF</option>
                <option value="curitiba">Curitiba-PR</option>
                <option value="fortaleza">Fortaleza-CE</option>
                <option value="manaus">Manaus-AM</option>
                <option value="riodejaneiro">Rio de Janeiro-RJ</option>
                <option value="saopaulo">São Paulo-SP</option>
            </select>

            <button class="btn-primario" onclick="window.location.href='cardapio.html'">Acessar Cardápio</button>
        </div>
    </main>
    <script src="js/produtos.js?v=1"></script>
    <script src="js/main.js?v=7"></script>
</body>
</html>
