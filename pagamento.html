<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raízes do Nordeste - Carrinho e Checkout</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <header class="cabecalho-principal">
        <img src="img/logo.png" alt="Raízes do Nordeste" class="logo-mini">
    </header>

    <main class="hero-section">
        <div class="card-central cartao-checkout">
            <h2>Carrinho</h2>

            <div class="resumo-carrinho-checkout">
                <ul id="lista-resumo-pagamento" class="lista-resumo-mini"></ul>
                <h3 style="margin-top: 1rem; text-align: right; color: #28a745; border-top: 1px solid #ccc; padding-top: 0.5rem;">
                    Total: <span id="total-pagamento">R$ 0,00</span>
                </h3>
            </div>
            
            <form id="form-pagamento" onsubmit="processarPagamento(event)">
                <div class="grupo-checkbox">
                    <input type="checkbox" id="fidelidade" onchange="atualizarTotalPagamento()">
                    <label for="fidelidade">Utilizar saldo de fidelidade <strong>(Desconto de R$ 10,00)</strong></label>
                </div>

                <select id="metodo-pagamento" class="input-padrao" onchange="validarPagamento()" required>
                    <option value="" disabled selected>Escolha a Forma de Pagamento...</option>
                    <option value="pix">PIX</option>
                    <option value="cartao">Cartão de Crédito</option>
                    <option value="debito">Cartão de Débito</option>
                </select>

                <!-- NOVA CLASSE APLICADA AQUI -->
                <div class="botoes-acao">
                    <button type="button" class="btn-secundario" onclick="window.location.href='cardapio.html'">ADICIONAR MAIS</button>
                    <button type="submit" id="btn-pagar" class="btn-primario" disabled>CONFIRMAR PEDIDO</button>
                </div>
                
                <p id="mensagem-status" class="mensagem-status"></p>
            </form>
        </div>
    </main>
    <script src="js/produtos.js?v=1"></script>
    <script src="js/main.js?v=7"></script>
</body>
</html>
