<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raízes do Nordeste - Pedido Confirmado</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="cabecalho-principal">
        <img src="img/logo.png" alt="Raízes do Nordeste" class="logo-mini">
    </header>

    <main class="hero-section">
        <div class="card-central">
            <h1 style="color: #28a745;">Pedido Confirmado!</h1>
            <p>Seu pagamento foi aprovado com sucesso.</p>
            
            <div class="resumo-pedido" style="text-align: left; background: #f8f9fa; padding: 1rem; border-radius: 8px; margin: 1.5rem 0;">
                <h3 style="margin-bottom: 1rem; color: #ff6b00;">Recibo do pedido:</h3>
                <ul id="lista-resumo" style="list-style-type: none; margin-bottom: 1rem; line-height: 1.6;"></ul>
                <h3 style="border-top: 1px solid #ccc; padding-top: 0.5rem;">Total Pago: <span id="total-resumo" style="color: #28a745;">R$ 0,00</span></h3>
            </div>

            <p style="font-weight: bold; font-size: 1.1rem; margin-bottom: 1.5rem;">A cozinha já está preparando seu pedido.</p>
            <button class="btn-primario" onclick="window.location.href='index.html'">Finalizar e Voltar ao Início</button>
        </div>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
